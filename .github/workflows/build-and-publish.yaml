name: Build and Publish ifacetool

on:
  workflow_dispatch:
  push:
    tags:
      - '0.6.5-*'

jobs:
  build-and-publish:
    name: Build and publish snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to the default branch
        if: github.event_name == 'push'
        run: |
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch:refs/remotes/origin/$default_branch"
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/$default_branch"

      - name: Decide whether to publish
        id: publish_decision
        run: |
          if [[ -n "${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Publish snap to edge
        if: steps.publish_decision.outputs.publish == 'true'
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge